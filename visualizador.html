<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergaminho - Taverna dos Textos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container viewer-container">
        <header>
            <h1 id="titulo-pergaminho">Carregando Pergaminho...</h1>
        </header>

        <main id="conteudo-pergaminho" class="pergaminho-content">
            <p>Aguarde enquanto buscamos o texto nos arquivos arcanos...</p>
            <!-- Conteúdo do TXT será carregado aqui -->
        </main>

        <footer>
            <a href="index.html">Voltar para a Taverna</a>
        </footer>
    </div>

    <script src="script.js"></script> 
    <script>
        // Script específico para o visualizador
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const arquivoUrl = urlParams.get('arquivo');
            const conteudoDiv = document.getElementById('conteudo-pergaminho');
            const tituloH1 = document.getElementById('titulo-pergaminho');

            if (arquivoUrl) {
                // Extrai um nome mais amigável do URL, se possível
                let nomeArquivo = 'Pergaminho Carregado';
                try {
                    const urlObj = new URL(arquivoUrl);
                    const pathParts = urlObj.pathname.split('/');
                    nomeArquivo = pathParts[pathParts.length - 1] || nomeArquivo;
                } catch (e) {
                    console.error('URL inválida:', arquivoUrl);
                }
                tituloH1.textContent = nomeArquivo;

                fetch(arquivoUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Erro ao buscar o arquivo: ${response.statusText}`);
                        }
                        return response.text();
                    })
                    .then(text => {
                        // Preserva quebras de linha e espaços
                        conteudoDiv.innerHTML = `<pre>${text}</pre>`; 
                    })
                    .catch(error => {
                        console.error('Erro ao carregar o pergaminho:', error);
                        conteudoDiv.innerHTML = `<p style="color: red;">Erro ao carregar o pergaminho. Verifique o link ou tente novamente.</p><p><small>${error.message}</small></p>`;
                        tituloH1.textContent = 'Erro ao Carregar';
                    });
            } else {
                conteudoDiv.innerHTML = '<p style="color: orange;">Nenhum pergaminho especificado no link.</p>';
                tituloH1.textContent = 'Pergaminho Não Encontrado';
            }
        });
    </script>
</body>
</html>
